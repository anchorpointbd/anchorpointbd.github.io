<style>
    /* ─── RESET & BASE ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: 'Inter', sans-serif;
      background: #061828;
      color: #d0dde8;
      line-height: 1.6;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }

    /* ─── TOKENS ─────────────────────────────────────────────────── */
    :root {

      --blue:   #00a8e8;
      --blue2:  #0085c3;
      --deep:   #061828;
      --light:  #f0f7ff;
      --muted:  #7a9ab8;
      --card:   #0d2f4a;
      --rule:   rgba(0,168,232,0.22);

    }

    /* ─── UTILITIES ──────────────────────────────────────────────── */
    .container { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
    .eyebrow {
      display: flex; align-items: center; gap: 12px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 600; letter-spacing: 3px;
      text-transform: uppercase; color: var(--blue);
      margin-bottom: 18px;
    }
    .eyebrow::before {
      content: ''; display: block;
      width: 32px; height: 1px; background: var(--blue);
      flex-shrink: 0;
    }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2rem, 4vw, 2.9rem);
      font-weight: 800; color: var(--white);
      line-height: 1.1; letter-spacing: -0.3px;
    }
    .section-body {
      font-family: 'Inter', sans-serif;
      font-size: .97rem; color: var(--muted);
      max-width: 580px; line-height: 1.8;
      margin-top: 14px;
    }
    .btn {outline: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 14px 30px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: pointer;
  transition: all .2s ease;
  border: none;
}
    
    .btn-primary {
  background: var(--blue);
  color: var(--white);
  box-shadow: 0 5px 18px rgba(0,168,232,0.18);
}

    .btn-primary:hover {
  background: var(--blue2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,168,232,0.28);
}
    .btn-ghost {
  background: rgba(255,255,255,0.02);
  color: var(--white);
  border: 1.5px solid rgba(255,255,255,0.3);
}

.btn-ghost:hover {
  background: rgba(255,255,255,0.05);
  border-color: var(--blue);
  color: var(--white);
  transform: translateY(-2px);
}

    /* ─── SCROLL REVEAL ──────────────────────────────────────────── */
    /* ─── PREMIUM SCROLL REVEAL — CHAPTER 3 ───────────────────────── */

.reveal {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition:
    opacity .65s cubic-bezier(.22,1,.36,1),
    transform .65s cubic-bezier(.22,1,.36,1);
  will-change: opacity, transform;
}

.reveal.visible {
  opacity: 1;
  transform: translate3d(0,0,0);
}

@media (prefers-reduced-motion: reduce) {
  .reveal,
  .reveal.visible {
    opacity: 1;
    transform: none;
    transition: none;
    will-change: auto;
  }
}

/* Directional entrance */
.reveal.from-left {
  transform: translate3d(-30px,0,0);
}

.reveal.from-right {
  transform: translate3d(30px,0,0);
}

.reveal.from-scale {
  transform: scale(.94);
}

.reveal.visible.from-left,
.reveal.visible.from-right {
  transform: translate3d(0,0,0);
}

.reveal.visible.from-scale {
  transform: scale(1);
}

/* Faster animation for cards */
.problem-card.reveal,
.service-card.reveal,
.sector-card.reveal,
.nv-box.reveal {
  transition-duration: .45s;
}

/* Interactive card base */
.problem-card,
.service-card,
.sector-card,
.nv-box {
  will-change: transform;
}

/* Problem cards */
.problem-card:hover {
  transform: translateY(-7px);
}

/* Service cards */
.service-card {
  position: relative;
  overflow: hidden;
}

.service-card::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  height: 2px;
  background: var(--blue);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .35s ease;
}

.service-card:hover::after {
  transform: scaleX(1);
}

.service-card:hover .sc-icon {
  transform: translateY(-3px) scale(1.08);
}

.sc-icon {
  transition: transform .3s cubic-bezier(.22,1,.36,1);
}

/* Sector cards */
.sector-card {
  overflow: hidden;
}

.sector-card:hover .sector-icon {
  transform: translateY(-4px) scale(1.08);
}

.sector-icon {
  transition: transform .3s cubic-bezier(.22,1,.36,1);
}

/* Network boxes */
.nv-box {
  transition:
    transform .3s cubic-bezier(.22,1,.36,1),
    box-shadow .3s ease,
    border-color .3s ease;
}

.nv-box:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 30px rgba(6,24,40,.10);
}

.nv-box .nv-icon {
  transition: transform .3s cubic-bezier(.22,1,.36,1);
}

.nv-box:hover .nv-icon {
  transform: scale(1.1) rotate(-3deg);
}

/* Process circles */
.process-step .step-num {
  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    box-shadow .35s ease;
}

.process-step:hover .step-num,
.process-step.active .step-num {
  transform: translateY(-5px) scale(1.06);
  box-shadow: 0 8px 25px rgba(0,168,232,.22);
}

/* Hero buttons */
.hero-actions .btn {
  position: relative;
  overflow: hidden;
}

.hero-actions .btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -120%;
  width: 80%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.16),
    transparent
  );
  transform: skewX(-20deg);
  transition: left .6s ease;
}

.hero-actions .btn:hover::after {
  left: 140%;
}

/* Hero stats */
.hero-stat-val {
  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    color .25s ease;
}

.hero-stats > div:hover .hero-stat-val {
  transform: translateY(-3px);
}

@media (prefers-reduced-motion: reduce) {
  .reveal,
  .reveal.from-left,
  .reveal.from-right,
  .reveal.from-scale {
    opacity: 1;
    transform: none;
    transition: none;
  }

  .problem-card,
  .service-card,
  .sector-card,
  .nv-box,
  .process-step .step-num,
  .hero-stat-val {
    transition: none;
  }
}

    /* ═══════════════════════════════════════════════════════════════
   CHAPTER 4 — NAVIGATION EXPERIENCE
   ═══════════════════════════════════════════════════════════════ */

.nav-hamburger {
  position: relative;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: background .25s ease;
}

.nav-hamburger:hover {
  background: rgba(0,168,232,.08);
}

.nav-hamburger span {
  position: absolute;
  width: 24px;
  height: 2px;
  transition:
    transform .3s cubic-bezier(.22,1,.36,1),
    opacity .2s ease;
}

.nav-hamburger span:nth-child(1) {
  transform: translateY(-7px);
}

.nav-hamburger span:nth-child(2) {
  transform: translateY(0);
}

.nav-hamburger span:nth-child(3) {
  transform: translateY(7px);
}

.nav-hamburger[aria-expanded="true"]
span:nth-child(1) {
  transform: rotate(45deg);
}

.nav-hamburger[aria-expanded="true"]
span:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}

.nav-hamburger[aria-expanded="true"]
span:nth-child(3) {
  transform: rotate(-45deg);
}


/* Mobile navigation panel */

.nav-mobile {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transform: translateY(-8px);
  transition:
    max-height .35s ease,
    opacity .25s ease,
    transform .35s ease;
}

.nav-mobile.open {
  max-height: 420px;
  opacity: 1;
  transform: translateY(0);
}


/* Mobile links */

.nav-mobile a {
  opacity: 0;
  transform: translateX(-12px);
  transition:
    opacity .25s ease,
    transform .25s ease,
    color .2s ease;
}

.nav-mobile.open a {
  opacity: 1;
  transform: translateX(0);
}

.nav-mobile.open a:nth-child(1) {
  transition-delay: .04s;
}

.nav-mobile.open a:nth-child(2) {
  transition-delay: .08s;
}

.nav-mobile.open a:nth-child(3) {
  transition-delay: .12s;
}

.nav-mobile.open a:nth-child(4) {
  transition-delay: .16s;
}

.nav-mobile.open a:nth-child(5) {
  transition-delay: .20s;
}


/* Active navigation item */

.nav-links a.active,
.nav-mobile a.active {
  color: var(--blue);
}

.nav-links a.active::after {
  transform: scaleX(1);
}


/* Better anchor positioning */

section {
  scroll-margin-top: 82px;
}


/* Touch-friendly controls */

@media (max-width: 900px) {

  .nav-mobile a {
    min-height: 48px;
    display: flex;
    align-items: center;
  }

  .nav-hamburger {
    display: flex;
  }

  .btn,
  .nav-cta,
  .cf-submit {
    min-height: 46px;
  }

}


/* Reduce motion */

@media (prefers-reduced-motion: reduce) {

  .nav-hamburger span,
  .nav-mobile,
  .nav-mobile a {
    transition: none;
  }

}

   CHAPTER 5 — PROFESSIONAL VISUAL POLISH

/* ─── PROBLEM CARDS ─────────────────────────────────────────── */

.problem-card {
  position: relative;
  overflow: hidden;
}

.problem-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--blue);
  transform: scaleY(.25);
  transform-origin: center;
  transition:
    transform .4s cubic-bezier(.22,1,.36,1);
}

.problem-card:hover::before,
.problem-card.visible::before {
  transform: scaleY(1);
}

.pc-icon {
  transition:
    transform .35s cubic-bezier(.22,1,.36,1);
}

.problem-card:hover .pc-icon {
  transform: translateY(-3px) scale(1.08);
}


/* ─── PROCESS ───────────────────────────────────────────────── */

.process-step {
  transition:
    transform .3s cubic-bezier(.22,1,.36,1);
}

.process-step:hover {
  transform: translateY(-3px);
}

.step-num {
  position: relative;
}

.step-num::after {
  content: '';
  position: absolute;
  inset: -7px;
  border: 1px solid rgba(0,168,232,.18);
  border-radius: 50%;
  transform: scale(.7);
  opacity: 0;
  transition:
    transform .4s ease,
    opacity .4s ease;
}

.process-step:hover .step-num::after,
.process-step.active .step-num::after {
  transform: scale(1);
  opacity: 1;
}


/* ─── SERVICE CARDS ─────────────────────────────────────────── */

.service-card {
  min-height: 250px;
}

.service-card .sc-title {
  transition: color .25s ease;
}

    letter-spacing .25s ease;

}


/* ─── SECTOR CARDS ──────────────────────────────────────────── */

.sector-card {
  position: relative;
  overflow: hidden;
}

.sector-card::after {
  content: '';
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: 0;
  height: 2px;
  background: var(--blue);
  transform: scaleX(0);
  transition:
    transform .35s cubic-bezier(.22,1,.36,1);
}

.sector-card:hover::after {
  transform: scaleX(1);
}
